<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Île des Maths — 3D</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #eef3f8; font-family: system-ui, sans-serif; }
      #scene { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #hud { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px; pointer-events: none; }
      #hud button { pointer-events: auto; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 14px; color: #fff; background: #3d7de0; box-shadow: 0 4px 12px rgba(40, 70, 120, 0.25); cursor: pointer; }
      #hud button.alt { background: #f07aa6; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <button id="spin" class="alt" type="button">Pause rotation</button>
      <button id="export" type="button">Exporter .glb</button>
    </div>
    <script type="module" src="/src/mathIsland/main.ts"></script>
  </body>
</html>
